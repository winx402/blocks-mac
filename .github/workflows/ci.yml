name: Source verification
on:
  pull_request:
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check build environment
        run: ./script/dev.sh doctor
      - name: Install verification tools
        run: |
          if ! command -v rg >/dev/null; then brew install ripgrep; fi
          if ! command -v gitleaks >/dev/null; then brew install gitleaks; fi
          rg --version
          gitleaks version
      - name: Check secrets without disclosing matches
        run: gitleaks git --redact --no-banner .
      - name: Verify installation and release failure paths
        run: |
          python3 tools/verification/install_entry_self_test.py
          python3 tools/verification/release_pipeline_self_test.py
          python3 tools/verification/application_update_safety_self_test.py
          python3 tools/verification/development_entry_self_test.py
          python3 tools/verification/development_signing_self_test.py
          python3 tools/verification/local_development_security_self_test.py
          ./script/test_ui_design_system.sh
      - name: Build certificate-free development targets
        run: ./script/dev.sh build
      - name: Run isolated tests without signing credentials
        run: ./script/dev.sh test
      - name: Report failed XCTest assertions
        if: failure()
        run: |
          for result in "$HOME"/Library/Developer/Xcode/DerivedData/Blocks-*/Logs/Test/*.xcresult; do
            [ -d "$result" ] || continue
            xcrun xcresulttool get test-results summary --path "$result" || true
          done
      - name: Preserve failed test results
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: failed-xctest-results
          path: ~/Library/Developer/Xcode/DerivedData/Blocks-*/Logs/Test/*.xcresult
          if-no-files-found: warn
          retention-days: 7
